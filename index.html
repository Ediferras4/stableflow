<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StableFlow Empty Shell</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#010505;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 18% 10%, rgba(77,214,224,.026), transparent 30%),
        radial-gradient(circle at 82% 88%, rgba(219,175,95,.016), transparent 30%),
        linear-gradient(180deg, #010505 0%, #000303 100%);
    }

    :root{
      --app-w:430px;
      --frame-x:12px;
      --frame-top:18px;
      --assistant-h:92px;
      --joint-h:22px;
      --bottom-h:80px;
      --side-rail-w:7px;

      --app-radius:0px;
      --screen-radius:13px;
      --assistant-radius:13px;
      --joint-radius:0 0 13px 13px;
      --cover-radius:0px;

      --black:#010707;
      --cyan:#56dde9;
      --gold:#d9b778;
      --green:#79ffb2;
      --cover-speed:940ms;
    }

    .app{
      position:relative;
      width:min(100vw, var(--app-w));
      height:100vh;
      height:100dvh;
      overflow:hidden;
      isolation:isolate;
      border-radius:var(--app-radius);
      background:
        radial-gradient(circle at 50% 0%, rgba(86,221,233,.018), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(217,183,120,.012), transparent 34%),
        #010707;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.010),
        0 0 40px rgba(0,0,0,.52),
        inset 0 0 0 1px rgba(255,255,255,.009);
    }

    .app::before,
    .app::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:var(--side-rail-w);
      z-index:22;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.018), transparent 12%, transparent 88%, rgba(255,255,255,.012)),
        linear-gradient(90deg, rgba(86,221,233,.030), rgba(0,0,0,.34), rgba(217,183,120,.018));
      box-shadow:
        0 0 16px rgba(86,221,233,.035),
        inset 0 0 10px rgba(0,0,0,.65);
      opacity:.86;
    }

    .app::before{
      left:0;
      border-right:1px solid rgba(86,221,233,.070);
    }

    .app::after{
      right:0;
      border-left:1px solid rgba(86,221,233,.052);
      transform:scaleX(-1);
      opacity:.58;
    }

    .top-band{
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:var(--frame-top);
      z-index:4;
      background:
        linear-gradient(90deg, rgba(86,221,233,.020), transparent 18%, transparent 82%, rgba(86,221,233,.014)),
        linear-gradient(180deg, #000707 0%, #010707 100%);
      border-bottom:1px solid rgba(217,183,120,.060);
      pointer-events:none;
    }

    .screen{
      position:absolute;
      left:var(--frame-x);
      right:var(--frame-x);
      top:var(--frame-top);
      bottom:var(--bottom-h);
      z-index:1;
      overflow:hidden;
      opacity:0;
      border-radius:var(--screen-radius);
      transition:opacity 520ms ease 220ms;
      background:
        radial-gradient(circle at 50% 34%, rgba(44,124,140,.105), transparent 34%),
        radial-gradient(circle at 50% 72%, rgba(20,73,88,.090), transparent 46%),
        radial-gradient(circle at 50% 100%, rgba(7,31,42,.55), transparent 42%),
        linear-gradient(180deg, #0b151b 0%, #071117 43%, #040a0e 100%);
      border:1px solid rgba(106,158,174,.115);
      box-shadow:
        inset 0 0 0 1px rgba(197,221,228,.018),
        inset 0 0 42px rgba(0,0,0,.43),
        inset 0 -22px 38px rgba(0,0,0,.24),
        0 18px 36px rgba(0,0,0,.30);
    }

    .screen::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(86,221,233,.018), transparent 13%, transparent 87%, rgba(86,221,233,.018)),
        linear-gradient(180deg, rgba(208,225,230,.016), transparent 13%, transparent 86%, rgba(64,139,154,.018));
      opacity:.74;
    }

    .screen::after{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      bottom:11px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(86,221,233,.052), transparent);
      opacity:.44;
      pointer-events:none;
    }

    .scroll{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      overflow-y:auto;
      overscroll-behavior:contain;
      scroll-behavior:smooth;
      padding:calc(var(--assistant-h) + var(--joint-h) + 16px) 14px 16px;
    }

    .scroll::-webkit-scrollbar{
      width:0;
      height:0;
    }

    .page{
      display:none;
      min-height:calc(100dvh - var(--assistant-h) - var(--joint-h) - var(--bottom-h) - var(--frame-top) - 34px);
      animation:pageIn .32s ease;
    }

    .page.active{
      display:grid;
      place-items:center;
    }

    @keyframes pageIn{
      from{opacity:0;transform:translateX(22px);}
      to{opacity:1;transform:translateX(0);}
    }

    .page-number{
      font-size:82px;
      line-height:1;
      font-weight:300;
      letter-spacing:-.085em;
      color:#dcebee;
      opacity:.46;
      text-shadow:
        0 0 8px rgba(86,221,233,.050),
        0 0 18px rgba(86,221,233,.024),
        0 0 16px rgba(197,221,228,.018);
    }

    .assistant{
      position:absolute;
      left:var(--frame-x);
      right:var(--frame-x);
      top:var(--frame-top);
      height:var(--assistant-h);
      z-index:5;
      overflow:hidden;
      border-radius:var(--assistant-radius) var(--assistant-radius) 8px 8px;
      transform:translateY(-130%);
      transition:transform 640ms cubic-bezier(.18,.92,.18,1) 260ms;
      border:1px solid rgba(111,184,202,.14);
      background:
        radial-gradient(circle at 10% -20%, rgba(126,216,255,.055), transparent 29%),
        radial-gradient(circle at 88% 16%, rgba(217,183,120,.026), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(4,35,45,.40), transparent 66%),
        linear-gradient(135deg,
          rgba(5,17,22,.99) 0%,
          rgba(8,30,38,.98) 46%,
          rgba(5,18,24,.99) 100%
        );
      box-shadow:
        0 10px 22px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.040),
        inset 0 0 18px rgba(86,221,233,.018),
        inset 0 -18px 24px rgba(0,8,12,.38);
      backdrop-filter:blur(4px);
    }

    .assistant-glow{
      position:absolute;
      inset:10px;
      border-radius:calc(var(--assistant-radius) - 4px);
      border:1px solid rgba(126,216,255,.040);
      box-shadow:
        inset 0 0 12px rgba(86,221,233,.014),
        0 0 0 1px rgba(217,183,120,.012);
      pointer-events:none;
    }

    .assistant-top-gold{
      position:absolute;
      left:16px;
      right:16px;
      top:8px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(126,216,255,.16), rgba(217,183,120,.075), transparent);
      opacity:.58;
      pointer-events:none;
    }

    .assistant-bottom-gold{
      position:absolute;
      left:16px;
      right:16px;
      bottom:8px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(126,216,255,.080), transparent);
      opacity:.44;
      pointer-events:none;
    }

    .assistant b{
      position:absolute;
      left:18px;
      top:15px;
      font-size:8px;
      letter-spacing:.34em;
      color:rgba(198,229,238,.58);
      text-transform:uppercase;
      z-index:2;
      text-shadow:0 0 8px rgba(86,221,233,.045);
    }

    .assistant p{
      position:absolute;
      left:18px;
      right:76px;
      bottom:15px;
      font-size:11.2px;
      font-weight:950;
      line-height:1.2;
      color:rgba(221,242,247,.88);
      text-shadow:
        0 1px 0 rgba(0,0,0,.45),
        0 0 10px rgba(86,221,233,.045);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      z-index:2;
    }

    .bot{
      position:absolute;
      right:15px;
      top:22px;
      width:46px;
      height:46px;
      border-radius:17px;
      border:1px solid rgba(126,216,255,.12);
      background:
        radial-gradient(circle at 50% 0%, rgba(126,216,255,.040), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.030), rgba(255,255,255,.006)),
        rgba(2,17,23,.62);
      box-shadow:
        inset 0 0 11px rgba(86,221,233,.018),
        0 6px 14px rgba(0,0,0,.20);
      z-index:2;
      opacity:.90;
    }

    .bot::before{
      content:"";
      position:absolute;
      left:9px;
      top:14px;
      width:27px;
      height:17px;
      border-radius:12px;
      border:4px solid rgba(215,241,247,.68);
      background:rgba(255,255,255,.010);
      box-shadow:0 0 8px rgba(86,221,233,.035);
    }

    .bot::after{
      content:"";
      position:absolute;
      left:17px;
      top:21px;
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(221,242,247,.82);
      box-shadow:12px 0 0 rgba(221,242,247,.82);
    }

    .assistant-joint{
      position:absolute;
      left:var(--frame-x);
      right:var(--frame-x);
      top:calc(var(--frame-top) + var(--assistant-h));
      height:var(--joint-h);
      z-index:4;
      opacity:0;
      transform:translateY(-8px);
      border-radius:var(--joint-radius);
      transition:
        opacity 430ms ease 320ms,
        transform 620ms cubic-bezier(.18,.92,.18,1) 300ms;
      background:
        linear-gradient(180deg, rgba(0,0,0,.94), rgba(1,7,7,1)),
        #010707;
      border-left:1px solid rgba(217,183,120,.055);
      border-right:1px solid rgba(217,183,120,.055);
      border-bottom:1px solid rgba(86,221,233,.030);
      box-shadow:
        0 10px 20px rgba(0,0,0,.40),
        inset 0 1px 0 rgba(255,255,255,.010);
      pointer-events:none;
    }

    .assistant-joint::before{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      top:0;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(217,183,120,.34), transparent);
      opacity:.84;
    }

    .assistant-joint::after{
      content:"";
      position:absolute;
      left:24px;
      right:24px;
      bottom:0;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(217,183,120,.16), rgba(86,221,233,.055), transparent);
      opacity:.54;
    }

    .joint-gold-left,
    .joint-gold-right{
      position:absolute;
      top:calc(50% + 1px);
      height:1px;
      transform:translateY(-50%);
      background:linear-gradient(90deg, transparent, rgba(217,183,120,.34), transparent);
      opacity:.72;
      pointer-events:none;
    }

    .joint-gold-left{
      left:28px;
      right:calc(50% + 68px);
    }

    .joint-gold-right{
      left:calc(50% + 68px);
      right:28px;
    }

    .tx-pill{
      position:absolute;
      left:50%;
      top:calc(50% + 1px);
      width:72px;
      height:12px;
      transform:translate(-50%, -50%);
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.010), rgba(255,255,255,.002)),
        #020808;
      border:1px solid rgba(217,183,120,.115);
      color:transparent;
      font-size:0;
      font-weight:950;
      letter-spacing:.12em;
      text-transform:uppercase;
      box-shadow:
        inset 0 0 8px rgba(255,255,255,.010),
        0 4px 10px rgba(0,0,0,.26);
      transition:
        width 260ms cubic-bezier(.2,.9,.18,1),
        height 260ms cubic-bezier(.2,.9,.18,1),
        border-color 260ms ease,
        background 260ms ease,
        color 220ms ease,
        box-shadow 260ms ease;
    }

    .tx-pill::before{
      content:"";
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(121,255,178,.10);
      box-shadow:none;
      opacity:.50;
      transition:.24s ease;
    }

    .tx-pill.active{
      width:100px;
      height:19px;
      background:
        radial-gradient(circle at 22% 50%, rgba(121,255,178,.30), transparent 42%),
        linear-gradient(180deg, rgba(121,255,178,.20), rgba(121,255,178,.055)),
        #03120d;
      border-color:rgba(121,255,178,.50);
      color:#d8ffe3;
      font-size:8px;
      box-shadow:
        0 0 16px rgba(121,255,178,.27),
        0 0 25px rgba(121,255,178,.085),
        inset 0 1px 0 rgba(255,255,255,.085),
        inset 0 0 10px rgba(121,255,178,.10);
      animation:txGreenPulse 1.15s ease-in-out infinite;
    }

    .tx-pill.active::before{
      width:7px;
      height:7px;
      margin-right:7px;
      background:var(--green);
      box-shadow:
        0 0 9px rgba(121,255,178,.70),
        0 0 13px rgba(121,255,178,.30);
      opacity:1;
    }

    @keyframes txGreenPulse{
      0%,100%{filter:brightness(1);}
      50%{filter:brightness(1.09);}
    }

    .bottom-controls{
      position:absolute;
      left:var(--frame-x);
      right:var(--frame-x);
      bottom:18px;
      height:52px;
      z-index:6;
      transform:translateY(145%);
      transition:transform 660ms cubic-bezier(.16,.9,.18,1) 360ms;
      display:grid;
      grid-template-columns:46px minmax(0,1fr) 112px;
      align-items:center;
      gap:12px;
      padding:0 2px;
      pointer-events:auto;
    }

    .brand-pill{
      position:relative;
      z-index:2;
      height:24px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.018), transparent 58%),
        linear-gradient(180deg, rgba(255,255,255,.008), rgba(255,255,255,.002)),
        #010707;
      border:1px solid rgba(217,183,120,.050);
      box-shadow:
        0 8px 16px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.010);
      color:rgba(201,213,219,.32);
      font-size:8px;
      font-weight:950;
      letter-spacing:.22em;
      text-transform:uppercase;
      overflow:hidden;
    }

    .brand-pill::before{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      top:50%;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(86,221,233,.075), transparent);
      opacity:.55;
      pointer-events:none;
    }

    .brand-pill span{
      position:relative;
      z-index:2;
      text-shadow:
        0 1px 0 rgba(255,255,255,.020),
        0 0 10px rgba(86,221,233,.025);
    }

    .exit-circle{
      position:relative;
      z-index:2;
      width:44px;
      height:44px;
      border-radius:50%;
      border:1px solid rgba(217,183,120,.25);
      background:
        radial-gradient(circle at 50% 0%, rgba(86,221,233,.030), transparent 58%),
        radial-gradient(circle at 50% 100%, rgba(217,183,120,.050), transparent 58%),
        linear-gradient(180deg, rgba(255,255,255,.012), rgba(255,255,255,.003)),
        #010909;
      color:#ded4b8;
      font-size:8px;
      font-weight:950;
      letter-spacing:.12em;
      text-transform:uppercase;
      cursor:pointer;
      box-shadow:
        0 9px 18px rgba(0,0,0,.34),
        0 0 16px rgba(217,183,120,.026),
        inset 0 0 12px rgba(255,255,255,.018);
    }

    .exit-circle::before{
      content:"";
      position:absolute;
      inset:-5px;
      border-radius:50%;
      border:1px solid rgba(217,183,120,.052);
      box-shadow:0 0 14px rgba(217,183,120,.025);
      pointer-events:none;
    }

    .exit-circle::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.038);
      pointer-events:none;
    }

    .exit-circle:active{
      transform:scale(.96);
    }

    .disconnect-switch{
      position:relative;
      z-index:2;
      width:112px;
      height:38px;
      border-radius:999px;
      border:1px solid rgba(217,183,120,.12);
      background:
        radial-gradient(circle at 18% 50%, rgba(86,221,233,.016), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,.010), rgba(255,255,255,.002)),
        #020808;
      color:rgba(221,213,189,.34);
      font-size:6.8px;
      font-weight:950;
      letter-spacing:.078em;
      text-transform:uppercase;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding:0 10px 0 38px;
      box-shadow:
        0 9px 18px rgba(0,0,0,.32),
        inset 0 0 11px rgba(255,255,255,.010);
      opacity:.68;
      cursor:pointer;
      transition:.28s ease;
    }

    .disconnect-switch::before{
      content:"";
      position:absolute;
      left:5px;
      top:5px;
      width:28px;
      height:28px;
      border-radius:50%;
      background:
        radial-gradient(circle at 42% 30%, rgba(255,255,255,.040), transparent 34%),
        radial-gradient(circle at 50% 70%, rgba(86,221,233,.020), transparent 50%),
        #050f0f;
      border:1px solid rgba(255,255,255,.050);
      box-shadow:
        inset 0 0 8px rgba(0,0,0,.45),
        0 0 0 rgba(121,255,178,0);
      transition:.28s cubic-bezier(.2,.9,.18,1);
    }

    .disconnect-switch::after{
      content:"";
      position:absolute;
      left:15px;
      top:15px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(121,255,178,.075);
      box-shadow:none;
      opacity:.46;
      transition:.28s ease;
    }

    .disconnect-switch.connected{
      opacity:1;
      color:#dcffef;
      border-color:rgba(121,255,178,.28);
      background:
        radial-gradient(circle at 84% 50%, rgba(121,255,178,.10), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,.014), rgba(255,255,255,.003)),
        #020909;
      padding:0 38px 0 10px;
      justify-content:flex-start;
    }

    .disconnect-switch.connected::before{
      left:77px;
      border-color:rgba(121,255,178,.30);
      background:
        radial-gradient(circle at 42% 30%, rgba(255,255,255,.065), transparent 34%),
        radial-gradient(circle at 50% 70%, rgba(121,255,178,.095), transparent 50%),
        #071211;
      box-shadow:
        inset 0 0 9px rgba(0,0,0,.40),
        0 0 16px rgba(121,255,178,.20);
    }

    .disconnect-switch.connected::after{
      left:87px;
      background:var(--green);
      box-shadow:0 0 10px rgba(121,255,178,.70);
      opacity:1;
    }

    .disconnect-switch:active{
      transform:scale(.98);
    }

    .cover{
      position:absolute;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      cursor:default;
      border-radius:var(--cover-radius);
      background:#000605;
      transform:translate3d(0,0,0);
      transition:transform var(--cover-speed) cubic-bezier(.14,.78,.14,1);
      will-change:transform;
      backface-visibility:hidden;
      transform-style:preserve-3d;
      box-shadow:
        -18px 0 42px rgba(0,0,0,.36),
        inset 1px 0 0 rgba(217,183,120,.055);
    }

    .cover::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      border-radius:inherit;
      background:
        radial-gradient(circle at 50% 39%, rgba(86,221,233,.020), transparent 32%),
        radial-gradient(circle at 50% 61%, rgba(217,183,120,.010), transparent 46%),
        radial-gradient(circle at 50% 88%, rgba(86,221,233,.010), transparent 44%),
        linear-gradient(180deg, #000807 0%, #000504 48%, #000706 100%);
      pointer-events:none;
    }

    .cover::after{
      content:"";
      position:absolute;
      top:18px;
      bottom:34px;
      left:0;
      width:28px;
      z-index:4;
      background:
        linear-gradient(270deg, transparent, rgba(86,221,233,.048), rgba(143,169,174,.038), transparent);
      box-shadow:
        inset 1px 0 0 rgba(139,196,205,.105),
        0 0 14px rgba(86,221,233,.070);
      opacity:.70;
      pointer-events:none;
      filter:blur(.12px);
    }

    .cover-vignette{
      position:absolute;
      inset:0;
      z-index:2;
      border-radius:inherit;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%, transparent 0%, transparent 31%, rgba(0,0,0,.34) 74%, rgba(0,0,0,.70) 100%),
        linear-gradient(180deg, rgba(0,0,0,.58), transparent 20%, transparent 80%, rgba(0,0,0,.64));
    }

    .cover-line-top,
    .cover-line-bottom{
      position:absolute;
      left:0;
      right:0;
      height:28px;
      z-index:3;
      pointer-events:none;
      opacity:.22;
      mask-image:linear-gradient(90deg, transparent 0%, black 16%, black 84%, transparent 100%);
      -webkit-mask-image:linear-gradient(90deg, transparent 0%, black 16%, black 84%, transparent 100%);
    }

    .cover-line-top{
      top:18px;
      background:
        linear-gradient(180deg, rgba(86,221,233,.065), rgba(86,221,233,.012) 2px, transparent 100%),
        radial-gradient(ellipse at center, rgba(86,221,233,.09), transparent 60%);
    }

    .cover-line-bottom{
      bottom:34px;
      background:
        linear-gradient(0deg, rgba(86,221,233,.055), rgba(86,221,233,.010) 2px, transparent 100%),
        radial-gradient(ellipse at center, rgba(143,169,174,.040), transparent 60%);
    }

    .cover-brand{
      position:relative;
      z-index:5;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:9px;
      transform:translateY(2px);
    }

    .logo-avatar{
      position:relative;
      width:154px;
      height:154px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(86,221,233,.072), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(154,180,188,.030), transparent 63%),
        linear-gradient(180deg, rgba(255,255,255,.010), rgba(255,255,255,.002)),
        #000807;
      box-shadow:
        0 0 20px rgba(86,221,233,.034),
        0 0 44px rgba(0,0,0,.58),
        0 18px 44px rgba(0,0,0,.36);
      cursor:pointer;
      transition:transform 160ms ease, filter 160ms ease;
      touch-action:manipulation;
    }

    .logo-avatar:active{
      transform:scale(.965);
      filter:brightness(1.06);
    }

    .logo-avatar::before{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:50%;
      border:1px solid rgba(99,190,210,.135);
      box-shadow:
        inset 0 0 16px rgba(86,221,233,.018),
        0 0 13px rgba(86,221,233,.030);
      pointer-events:none;
      animation:outerRingBreath 3.9s ease-in-out infinite;
    }

    @keyframes outerRingBreath{
      0%,100%{
        border-color:rgba(99,190,210,.105);
        box-shadow:
          inset 0 0 14px rgba(86,221,233,.012),
          0 0 10px rgba(86,221,233,.022);
        opacity:.76;
      }

      50%{
        border-color:rgba(126,216,255,.32);
        box-shadow:
          inset 0 0 18px rgba(86,221,233,.030),
          0 0 18px rgba(86,221,233,.090),
          0 0 32px rgba(126,216,255,.040);
        opacity:1;
      }
    }

    .logo-avatar::after{
      content:"";
      position:absolute;
      inset:16px;
      border-radius:50%;
      border:1px solid rgba(168,196,205,.115);
      box-shadow:
        inset 0 0 14px rgba(143,194,205,.014),
        0 0 14px rgba(86,221,233,.018);
      pointer-events:none;
    }

    .logo-avatar-core{
      position:relative;
      z-index:3;
      width:100px;
      height:100px;
      border-radius:50%;
      overflow:hidden;
      background:#020202;
      border:1px solid rgba(116,167,178,.135);
      box-shadow:
        0 0 0 1px rgba(86,221,233,.040),
        0 0 14px rgba(86,221,233,.032),
        0 0 14px rgba(171,202,209,.018),
        inset 0 0 20px rgba(0,0,0,.72);
      pointer-events:none;
    }

    .logo-avatar-core::after{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:50%;
      border:1px solid rgba(217,183,120,.055);
      pointer-events:none;
    }

    .logo-avatar-core img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      border-radius:50%;
      background:#020202;
      filter:
        brightness(1.04)
        contrast(1.06)
        saturate(1.02);
    }

    .logo-fallback{
      width:100%;
      height:100%;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      border-radius:50%;
      background:#020202;
    }

    .logo-fallback span{
      color:#edf6f7;
      font-size:17px;
      font-weight:950;
      letter-spacing:.16em;
      text-shadow:
        0 0 8px rgba(255,255,255,.055),
        0 0 10px rgba(86,221,233,.070);
    }

    .logo-fallback small{
      display:block;
      margin-top:7px;
      color:#80e8ef;
      font-size:9px;
      font-weight:900;
      letter-spacing:.20em;
      text-shadow:0 0 8px rgba(86,221,233,.090);
    }

    .cover-brand-name{
      position:relative;
      z-index:5;
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:1px;
      line-height:1;
      background:transparent;
      border:0;
      padding:0;
      box-shadow:none;
      pointer-events:none;
    }

    .cover-brand-name .stable{
      color:#eef8ff;
      font-size:28px;
      font-weight:950;
      letter-spacing:-.065em;
      text-shadow:
        0 1px 0 rgba(255,255,255,.13),
        0 0 8px rgba(238,248,255,.060),
        0 7px 18px rgba(0,0,0,.40);
    }

    .cover-brand-name .flow{
      color:#7ed8ff;
      font-size:28px;
      font-weight:950;
      letter-spacing:-.065em;
      text-shadow:
        0 0 9px rgba(126,216,255,.18),
        0 0 16px rgba(86,221,233,.080),
        0 7px 18px rgba(0,0,0,.40);
    }

    .open-hint{
      position:relative;
      z-index:5;
      margin-top:5px;
      color:rgba(157,190,203,.52);
      font-size:8px;
      font-weight:900;
      letter-spacing:.22em;
      text-transform:uppercase;
      text-shadow:0 0 8px rgba(86,221,233,.055);
      pointer-events:none;
      animation:hintPulse 3.8s ease-in-out infinite;
    }

    @keyframes hintPulse{
      0%,100%{opacity:.44;}
      50%{opacity:.70;}
    }

    .app.open .assistant{
      transform:translateY(0);
    }

    .app.open .assistant-joint{
      opacity:1;
      transform:translateY(0);
    }

    .app.open .screen{
      opacity:1;
    }

    .app.open .bottom-controls{
      transform:translateY(0);
    }

    .app.open .cover{
      transform:translate3d(calc(100% + 44px),0,0);
      pointer-events:none;
    }

    @media (min-width:700px){
      :root{
        --app-w:680px;
        --frame-x:18px;
        --frame-top:20px;
        --assistant-h:94px;
        --joint-h:22px;
        --bottom-h:86px;
        --side-rail-w:10px;

        --app-radius:22px;
        --screen-radius:20px;
        --assistant-radius:18px;
        --joint-radius:0 0 16px 16px;
        --cover-radius:22px;
      }

      .app{
        width:min(94vw, var(--app-w));
        height:min(100dvh, 920px);
        border-left:1px solid rgba(86,221,233,.045);
        border-right:1px solid rgba(86,221,233,.035);
      }

      .top-band{
        border-radius:22px 22px 0 0;
      }

      .bottom-controls{
        bottom:22px;
        grid-template-columns:48px minmax(220px,1fr) 124px;
        gap:16px;
        height:56px;
      }

      .brand-pill{
        height:26px;
      }

      .exit-circle{
        width:46px;
        height:46px;
      }

      .disconnect-switch{
        width:124px;
        height:40px;
      }

      .disconnect-switch.connected::before{
        left:88px;
      }

      .disconnect-switch.connected::after{
        left:98px;
      }

      .screen{
        box-shadow:
          inset 0 0 0 1px rgba(197,221,228,.020),
          inset 0 0 58px rgba(0,0,0,.46),
          inset 0 -26px 44px rgba(0,0,0,.26),
          0 18px 38px rgba(0,0,0,.34);
      }

      .page-number{
        font-size:94px;
      }
    }

    @media (min-width:1024px){
      :root{
        --app-w:940px;
        --frame-x:26px;
        --frame-top:24px;
        --assistant-h:96px;
        --joint-h:24px;
        --bottom-h:92px;
        --side-rail-w:14px;

        --app-radius:28px;
        --screen-radius:24px;
        --assistant-radius:22px;
        --joint-radius:0 0 18px 18px;
        --cover-radius:28px;
      }

      .app{
        width:min(82vw, var(--app-w));
        height:min(100dvh, 940px);
        box-shadow:
          0 0 0 1px rgba(255,255,255,.012),
          0 0 60px rgba(0,0,0,.68),
          0 24px 80px rgba(0,0,0,.44),
          inset 0 0 0 1px rgba(255,255,255,.010);
      }

      .top-band{
        border-radius:28px 28px 0 0;
      }

      .assistant{
        max-width:none;
      }

      .scroll{
        padding:calc(var(--assistant-h) + var(--joint-h) + 22px) 28px 24px;
      }

      .page{
        min-height:calc(min(100dvh, 940px) - var(--assistant-h) - var(--joint-h) - var(--bottom-h) - var(--frame-top) - 58px);
      }

      .page-number{
        font-size:106px;
      }

      .bottom-controls{
        bottom:24px;
        grid-template-columns:50px minmax(340px,1fr) 132px;
        gap:18px;
      }

      .brand-pill{
        height:28px;
        letter-spacing:.28em;
      }

      .exit-circle{
        width:48px;
        height:48px;
      }

      .disconnect-switch{
        width:132px;
        height:42px;
        font-size:7px;
      }

      .disconnect-switch.connected::before{
        left:96px;
      }

      .disconnect-switch.connected::after{
        left:106px;
      }

      .cover-brand{
        transform:translateY(4px) scale(1.02);
      }

      .screen::before{
        background:
          linear-gradient(90deg, rgba(86,221,233,.026), transparent 10%, transparent 90%, rgba(86,221,233,.026)),
          linear-gradient(180deg, rgba(208,225,230,.018), transparent 13%, transparent 86%, rgba(64,139,154,.022));
      }
    }

    @media (max-width:360px){
      :root{
        --frame-x:10px;
        --bottom-h:78px;
        --screen-radius:11px;
        --assistant-radius:11px;
      }

      .bottom-controls{
        gap:9px;
        grid-template-columns:44px minmax(0,1fr) 106px;
      }

      .disconnect-switch{
        width:106px;
        font-size:6.4px;
      }

      .disconnect-switch.connected::before{
        left:71px;
      }

      .disconnect-switch.connected::after{
        left:81px;
      }

      .cover-brand{
        transform:translateY(0) scale(.96);
      }
    }
  </style>
</head>

<body>
  <main class="app" id="app">

    <div class="top-band"></div>

    <section class="screen" id="swipeZone">
      <div class="scroll">
        <article class="page active" data-page="page1">
          <div class="page-number">1</div>
        </article>

        <article class="page" data-page="page2">
          <div class="page-number">2</div>
        </article>

        <article class="page" data-page="page3">
          <div class="page-number">3</div>
        </article>

        <article class="page" data-page="page4">
          <div class="page-number">4</div>
        </article>

        <article class="page" data-page="page5">
          <div class="page-number">5</div>
        </article>

        <article class="page" data-page="page6">
          <div class="page-number">6</div>
        </article>
      </div>
    </section>

    <section class="assistant">
      <div class="assistant-glow"></div>
      <div class="assistant-top-gold"></div>
      <div class="assistant-bottom-gold"></div>
      <b>ASSISTANT</b>
      <p id="assistantText">Page 1 ready for lapidation.</p>
      <div class="bot"></div>
    </section>

    <div class="assistant-joint">
      <span class="joint-gold-left"></span>
      <div class="tx-pill" id="txPill"></div>
      <span class="joint-gold-right"></span>
    </div>

    <div class="bottom-controls">
      <button class="exit-circle" id="exitBtn">Exit</button>

      <div class="brand-pill">
        <span>StableFlow</span>
      </div>

      <button class="disconnect-switch" id="disconnectBtn" type="button">Disconnect</button>
    </div>

    <section class="cover" id="cover">
      <div class="cover-vignette"></div>
      <div class="cover-line-top"></div>
      <div class="cover-line-bottom"></div>

      <div class="cover-brand">
        <div class="logo-avatar" id="openHotspot" role="button" aria-label="Open StableFlow">
          <div class="logo-avatar-core">
            <img
              src="logo.png"
              alt="StableFlow logo"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />
            <div class="logo-fallback">
              <span>FLOW</span>
              <small>TAP</small>
            </div>
          </div>
        </div>

        <div class="cover-brand-name">
          <span class="stable">Stable</span><span class="flow">Flow</span>
        </div>

        <div class="open-hint">tap logo to enter</div>
      </div>
    </section>

  </main>

  <script>
    const app = document.getElementById("app");
    const openHotspot = document.getElementById("openHotspot");
    const exitBtn = document.getElementById("exitBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const assistantText = document.getElementById("assistantText");
    const pages = Array.from(document.querySelectorAll(".page"));
    const swipeZone = document.getElementById("swipeZone");
    const txPill = document.getElementById("txPill");

    const route = ["page1","page2","page3","page4","page5","page6"];

    let index = 0;
    let disconnectPreviewOn = false;
    let txNoticeTimer = null;

    function openShell(){
      app.classList.add("open");
    }

    function closeShell(){
      app.classList.remove("open");
      clearTxNotice();
      disconnectPreviewOn = false;
      updateDisconnectState();
      setTimeout(() => setPage(0), 180);
    }

    function updateDisconnectState(){
      disconnectBtn.classList.toggle("connected", disconnectPreviewOn);
    }

    function flashTxDone(){
      clearTimeout(txNoticeTimer);

      txPill.textContent = "TX DONE";
      txPill.classList.add("active");

      txNoticeTimer = setTimeout(() => {
        clearTxNotice();
      }, 5000);
    }

    function clearTxNotice(){
      clearTimeout(txNoticeTimer);
      txPill.classList.remove("active");
      txPill.textContent = "";
    }

    function setWalletConnected(value){
      disconnectPreviewOn = Boolean(value);
      updateDisconnectState();
    }

    function setPage(i){
      if(i < 0) i = route.length - 1;
      if(i >= route.length) i = 0;

      index = i;
      const pageName = route[index];
      const pageNumber = index + 1;

      pages.forEach(page => {
        page.classList.toggle("active", page.dataset.page === pageName);
      });

      assistantText.textContent = "Page " + pageNumber + " ready for lapidation.";
    }

    openHotspot.addEventListener("pointerdown", e => {
      e.stopPropagation();
      openShell();
    });

    openHotspot.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        openShell();
      }
    });

    exitBtn.addEventListener("click", closeShell);

    disconnectBtn.addEventListener("click", () => {
      disconnectPreviewOn = !disconnectPreviewOn;
      updateDisconnectState();
      flashTxDone();
    });

    let startX = 0;
    let startY = 0;
    let tracking = false;

    function startSwipe(x, y){
      startX = x;
      startY = y;
      tracking = true;
    }

    function endSwipe(x, y){
      if(!tracking) return;

      tracking = false;

      const dx = x - startX;
      const dy = y - startY;

      if(Math.abs(dx) < 42) return;
      if(Math.abs(dx) < Math.abs(dy) * 1.2) return;

      openShell();

      if(dx < 0){
        setPage(index + 1);
      }else{
        setPage(index - 1);
      }
    }

    swipeZone.addEventListener("touchstart", e => {
      const t = e.touches[0];
      startSwipe(t.clientX, t.clientY);
    }, { passive:true });

    swipeZone.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      endSwipe(t.clientX, t.clientY);
    }, { passive:true });

    swipeZone.addEventListener("mousedown", e => {
      startSwipe(e.clientX, e.clientY);
    });

    swipeZone.addEventListener("mouseup", e => {
      endSwipe(e.clientX, e.clientY);
    });

    window.StableFlowShell = {
      setWalletConnected,
      openShell,
      closeShell,
      setPage,
      flashTxDone,
      clearTxNotice
    };

    setPage(0);
    updateDisconnectState();
  </script>
</body>
  </html>
