<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StableFlow Shell</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    :root{
      --bg:#02070b;
      --deep:#000306;
      --page:#050b10;
      --page2:#081119;

      --blue:#77d8ff;
      --blue2:#38bff5;
      --blue-soft:rgba(74,196,255,.18);
      --blue-line:rgba(125,216,255,.28);

      --ice:#eaf3f7;
      --silver:#aab8c3;
      --muted:#5f717d;

      --gold:#e7b85b;
      --gold2:#f3cc78;
      --gold-soft:rgba(231,184,91,.14);

      --line:rgba(255,255,255,.075);
      --line2:rgba(132,211,255,.12);

      --footer-h:58px;
      --assistant-h:96px;
    }

    html,
    body{
      width:100%;
      min-height:100%;
      background:#000;
      overflow:hidden;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ice);
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .phone{
      width:100vw;
      height:100vh;
      max-width:470px;
      max-height:940px;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 28%, rgba(77,190,255,.055), transparent 36%),
        linear-gradient(180deg,#010407 0%,#02070b 44%,#000203 100%);
      isolation:isolate;
    }

    @media (min-width:760px){
      .phone{
        width:min(520px,92vw);
        height:min(900px,94vh);
        border:1px solid rgba(130,210,255,.12);
        border-radius:34px;
        box-shadow:
          0 0 80px rgba(0,0,0,.95),
          0 0 70px rgba(48,190,255,.08);
      }
    }

    .shell{
      position:absolute;
      inset:0;
      overflow:hidden;
      background:
        linear-gradient(180deg,#02080d 0%,#02070b 100%);
    }

    .assistant{
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:var(--assistant-h);
      z-index:20;
      padding:13px 18px 10px;
      background:
        radial-gradient(circle at 22% 0%,rgba(104,214,255,.22),transparent 44%),
        linear-gradient(180deg,rgba(5,20,30,.96),rgba(3,10,16,.88));
      border-bottom:1px solid rgba(134,217,255,.14);
      box-shadow:
        0 18px 34px rgba(0,0,0,.34),
        inset 0 -1px 0 rgba(255,255,255,.035);
      backdrop-filter:blur(18px);
      transform:translateY(-100%);
      transition:transform .74s cubic-bezier(.18,.86,.18,1);
    }

    .shell.open .assistant{
      transform:translateY(0);
    }

    .assistant-inner{
      width:100%;
      height:100%;
      border-radius:24px;
      border:1px solid rgba(125,216,255,.12);
      background:
        linear-gradient(135deg,rgba(136,222,255,.115),rgba(255,255,255,.025) 42%,rgba(5,12,18,.1));
      display:flex;
      align-items:center;
      gap:12px;
      padding:11px 13px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 14px 32px rgba(0,0,0,.22);
    }

    .assistant-face{
      width:42px;
      height:42px;
      border-radius:50%;
      position:relative;
      flex:0 0 auto;
      background:
        radial-gradient(circle at 34% 28%,rgba(255,255,255,.25),transparent 20%),
        linear-gradient(145deg,#0e2533,#061019);
      border:1px solid rgba(128,222,255,.2);
      box-shadow:
        0 0 26px rgba(93,211,255,.12),
        inset 0 0 16px rgba(90,210,255,.08);
    }

    .assistant-face:before,
    .assistant-face:after{
      content:"";
      position:absolute;
      top:17px;
      width:5px;
      height:5px;
      border-radius:50%;
      background:#8de4ff;
      box-shadow:0 0 9px rgba(141,228,255,.8);
    }

    .assistant-face:before{left:13px}
    .assistant-face:after{right:13px}

    .assistant-mouth{
      position:absolute;
      left:50%;
      bottom:12px;
      width:13px;
      height:5px;
      transform:translateX(-50%);
      border-bottom:1.5px solid rgba(141,228,255,.78);
      border-radius:0 0 20px 20px;
    }

    .assistant-copy{
      min-width:0;
      flex:1;
    }

    .assistant-kicker{
      font-size:9px;
      letter-spacing:.18em;
      color:rgba(155,224,255,.72);
      font-weight:800;
      text-transform:uppercase;
      margin-bottom:4px;
    }

    .assistant-text{
      font-size:12px;
      line-height:1.25;
      color:rgba(237,248,255,.86);
      letter-spacing:.01em;
    }

    .tx-strip{
      position:absolute;
      top:var(--assistant-h);
      left:0;
      right:0;
      height:24px;
      z-index:18;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.42));
      border-bottom:1px solid rgba(231,184,91,.16);
      box-shadow:0 8px 18px rgba(0,0,0,.28);
      opacity:0;
      transform:translateY(-16px);
      pointer-events:none;
      transition:.35s ease;
    }

    .tx-strip.show{
      opacity:1;
      transform:translateY(0);
    }

    .tx-pill{
      height:15px;
      padding:0 13px;
      border-radius:999px;
      border:1px solid rgba(231,184,91,.28);
      background:rgba(231,184,91,.08);
      color:rgba(255,226,170,.92);
      font-size:8px;
      line-height:13px;
      letter-spacing:.18em;
      font-weight:900;
      text-transform:uppercase;
      box-shadow:0 0 18px rgba(231,184,91,.1);
    }

    .pages-wrap{
      position:absolute;
      top:0;
      left:0;
      right:0;
      bottom:var(--footer-h);
      padding-top:calc(var(--assistant-h) + 24px);
      overflow:hidden;
      z-index:5;
      background:
        radial-gradient(circle at 50% 18%,rgba(87,203,255,.04),transparent 38%),
        linear-gradient(180deg,#050b10 0%,#020609 100%);
    }

    .pages{
      width:500%;
      height:100%;
      display:flex;
      transform:translateX(0%);
      transition:transform .52s cubic-bezier(.2,.88,.18,1);
    }

    .page{
      width:20%;
      height:100%;
      overflow-y:auto;
      overscroll-behavior:contain;
      padding:24px 18px 26px;
      scrollbar-width:none;
    }

    .page::-webkit-scrollbar{
      display:none;
    }

    .page-inner{
      min-height:100%;
      border-radius:28px;
      border:1px solid rgba(125,216,255,.09);
      background:
        radial-gradient(circle at 50% 10%,rgba(122,221,255,.055),transparent 36%),
        linear-gradient(180deg,#071018,#04090e);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        inset 0 -1px 0 rgba(0,0,0,.45),
        0 20px 55px rgba(0,0,0,.36);
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(230,244,255,.26);
      font-size:64px;
      font-weight:900;
      letter-spacing:-.08em;
      user-select:none;
    }

    .footer{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:var(--footer-h);
      z-index:24;
      background:
        linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.86));
      border-top:1px solid rgba(125,216,255,.09);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 17px calc(env(safe-area-inset-bottom,0px) * .55);
      transform:translateY(100%);
      transition:transform .74s cubic-bezier(.18,.86,.18,1);
      box-shadow:0 -20px 34px rgba(0,0,0,.38);
    }

    .shell.open .footer{
      transform:translateY(0);
    }

    .exit-btn{
      width:38px;
      height:38px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.105);
      background:
        radial-gradient(circle at 34% 28%,rgba(255,255,255,.09),transparent 24%),
        linear-gradient(145deg,#101820,#030608);
      color:rgba(226,236,242,.8);
      font-size:9px;
      letter-spacing:.11em;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 12px 28px rgba(0,0,0,.38);
      cursor:pointer;
    }

    .footer-brand{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      color:rgba(207,222,232,.22);
      font-size:9px;
      letter-spacing:.22em;
      font-weight:900;
      text-transform:uppercase;
      pointer-events:none;
    }

    .disconnect{
      min-width:78px;
      height:27px;
      border-radius:999px;
      border:1px solid rgba(125,216,255,.1);
      background:
        linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
      color:rgba(170,190,202,.38);
      font-size:8px;
      letter-spacing:.12em;
      font-weight:900;
      text-transform:uppercase;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.25s ease;
    }

    .disconnect.active{
      color:rgba(215,244,255,.86);
      border-color:rgba(125,216,255,.2);
      box-shadow:0 0 18px rgba(75,199,255,.08);
    }

    .cover{
      position:absolute;
      inset:0;
      z-index:60;
      overflow:hidden;
      background:#000;
      transition:opacity .4s ease .55s, visibility .4s ease .55s;
    }

    .cover.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .cover-band{
      position:absolute;
      left:0;
      right:0;
      height:50.5%;
      background:
        radial-gradient(circle at 50% 100%,rgba(84,220,255,.075),transparent 42%),
        linear-gradient(180deg,#010607,#000202);
      transition:transform .82s cubic-bezier(.7,0,.22,1);
      will-change:transform;
    }

    .cover-band.top{
      top:0;
      border-bottom:1px solid rgba(125,216,255,.06);
    }

    .cover-band.bottom{
      bottom:0;
      border-top:1px solid rgba(125,216,255,.05);
    }

    .cover.opening .cover-band.top{
      transform:translateY(-105%);
    }

    .cover.opening .cover-band.bottom{
      transform:translateY(105%);
    }

    .cover:before{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      background:
        linear-gradient(90deg,
          rgba(66,226,255,.1) 0px,
          transparent 3px,
          transparent calc(100% - 3px),
          rgba(66,226,255,.08) 100%),
        radial-gradient(circle at 50% 49%,rgba(82,212,255,.12),transparent 32%),
        radial-gradient(circle at 50% 51%,rgba(231,184,91,.055),transparent 19%);
      opacity:.7;
      transition:opacity .55s ease;
    }

    .cover.opening:before{
      opacity:0;
    }

    .cover-side-signal{
      position:absolute;
      top:18%;
      bottom:13%;
      width:18px;
      z-index:5;
      pointer-events:none;
      opacity:.78;
      filter:drop-shadow(0 0 12px rgba(74,206,255,.12));
    }

    .cover-side-signal.left{
      left:18px;
      border-left:1px solid rgba(96,216,255,.18);
      box-shadow:
        inset 8px 0 12px rgba(80,210,255,.035),
        -2px 0 16px rgba(57,202,255,.08);
    }

    .cover-side-signal.right{
      right:18px;
      border-right:1px solid rgba(96,216,255,.14);
      box-shadow:
        inset -8px 0 12px rgba(80,210,255,.025),
        2px 0 16px rgba(57,202,255,.055);
    }

    .cover-side-signal:before,
    .cover-side-signal:after{
      content:"";
      position:absolute;
      width:5px;
      height:44px;
      border-radius:999px;
      background:linear-gradient(180deg,transparent,rgba(115,226,255,.24),transparent);
    }

    .cover-side-signal.left:before{left:-3px;top:11%}
    .cover-side-signal.left:after{left:-3px;bottom:16%}
    .cover-side-signal.right:before{right:-3px;top:16%}
    .cover-side-signal.right:after{right:-3px;bottom:11%}

    .cover-center{
      position:absolute;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .enter-zone{
      width:280px;
      height:310px;
      border:0;
      background:transparent;
      color:inherit;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      pointer-events:auto;
      touch-action:manipulation;
      user-select:none;
      position:relative;
    }

    .enter-zone:before{
      content:"";
      position:absolute;
      width:248px;
      height:248px;
      border-radius:50%;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      background:
        radial-gradient(circle,rgba(87,215,255,.055),transparent 62%);
      opacity:.9;
      transition:.22s ease;
    }

    .enter-zone.pressed:before{
      transform:translateX(-50%) scale(.95);
      opacity:1;
    }

    .logo-orb{
      width:150px;
      height:150px;
      border-radius:50%;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 46%,rgba(0,0,0,.98),rgba(0,0,0,.92) 52%,rgba(8,18,22,.94) 100%);
      border:1px solid rgba(129,230,255,.18);
      box-shadow:
        0 0 0 10px rgba(107,226,255,.025),
        0 0 0 22px rgba(107,226,255,.018),
        0 0 0 36px rgba(107,226,255,.012),
        0 0 42px rgba(69,210,255,.08),
        inset 0 0 28px rgba(0,0,0,.95),
        inset 0 1px 0 rgba(255,255,255,.06);
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .logo-orb:before{
      content:"";
      position:absolute;
      inset:-13px;
      border-radius:50%;
      border:1px solid rgba(129,230,255,.12);
      box-shadow:
        0 0 22px rgba(78,214,255,.055),
        inset 0 0 18px rgba(78,214,255,.035);
      animation:orbPulse 2.7s ease-in-out infinite;
    }

    .logo-orb:after{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:50%;
      border:1px solid rgba(231,184,91,.12);
      opacity:.8;
    }

    .enter-zone.pressed .logo-orb{
      transform:scale(.94);
      border-color:rgba(129,230,255,.34);
      box-shadow:
        0 0 0 11px rgba(107,226,255,.035),
        0 0 0 23px rgba(107,226,255,.022),
        0 0 54px rgba(69,210,255,.18),
        inset 0 0 30px rgba(0,0,0,1);
    }

    @keyframes orbPulse{
      0%,100%{
        opacity:.48;
        transform:scale(1);
      }
      50%{
        opacity:.95;
        transform:scale(1.055);
      }
    }

    .bird{
      width:98px;
      height:98px;
      position:relative;
      z-index:3;
      filter:
        drop-shadow(0 0 4px rgba(245,203,117,.26))
        drop-shadow(0 0 10px rgba(245,203,117,.12));
    }

    .bird svg{
      width:100%;
      height:100%;
      display:block;
    }

    .brand{
      margin-top:25px;
      position:relative;
      font-size:37px;
      line-height:.9;
      letter-spacing:-.09em;
      font-weight:950;
      transform:translateX(-1px);
      text-shadow:
        0 2px 0 rgba(0,0,0,.72),
        0 8px 24px rgba(107,216,255,.07);
    }

    .brand .stable{
      color:#edf3f6;
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.1));
    }

    .brand .flow{
      color:#73d8ff;
      text-shadow:
        0 1px 0 rgba(255,255,255,.12),
        0 0 18px rgba(115,216,255,.18);
    }

    .brand:after{
      content:"";
      position:absolute;
      left:10px;
      right:7px;
      bottom:-9px;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(125,216,255,.16),transparent);
    }

    .tap-label{
      margin-top:31px;
      font-size:10px;
      letter-spacing:.38em;
      text-indent:.38em;
      font-weight:900;
      text-transform:uppercase;
      color:rgba(199,222,232,.37);
      text-shadow:0 0 14px rgba(128,216,255,.09);
      transition:.22s ease;
    }

    .tap-hint{
      margin-top:12px;
      width:94px;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,rgba(117,219,255,.45),transparent);
      opacity:.48;
      animation:hintFlow 1.65s ease-in-out infinite;
    }

    @keyframes hintFlow{
      0%,100%{
        transform:scaleX(.55);
        opacity:.2;
      }
      50%{
        transform:scaleX(1);
        opacity:.65;
      }
    }

    .enter-zone.pressed .tap-label{
      color:rgba(220,244,255,.74);
    }

    .cover.opening .enter-zone{
      pointer-events:none;
    }

    .cover.opening .cover-center{
      animation:centerFade .42s ease forwards;
    }

    @keyframes centerFade{
      to{
        opacity:0;
        transform:scale(.975);
      }
    }

    .cover-grain{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      opacity:.18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 68%);
    }

    .cover-bottom-glow{
      position:absolute;
      left:12%;
      right:12%;
      bottom:10%;
      height:1px;
      z-index:6;
      background:linear-gradient(90deg,transparent,rgba(110,225,255,.12),transparent);
      box-shadow:0 0 24px rgba(95,219,255,.12);
    }

    .swipe-catcher{
      position:absolute;
      inset:0;
      z-index:1;
    }
  </style>
</head>

<body>
  <main class="phone">
    <section class="shell" id="shell">
      <div class="assistant">
        <div class="assistant-inner">
          <div class="assistant-face">
            <div class="assistant-mouth"></div>
          </div>
          <div class="assistant-copy">
            <div class="assistant-kicker">StableFlow assistant</div>
            <div class="assistant-text" id="assistantText">
              Swipe sideways to move through the pages.
            </div>
          </div>
        </div>
      </div>

      <div class="tx-strip" id="txStrip">
        <div class="tx-pill">TX DONE</div>
      </div>

      <div class="pages-wrap" id="pagesWrap">
        <div class="pages" id="pages">
          <section class="page">
            <div class="page-inner">1</div>
          </section>
          <section class="page">
            <div class="page-inner">2</div>
          </section>
          <section class="page">
            <div class="page-inner">3</div>
          </section>
          <section class="page">
            <div class="page-inner">4</div>
          </section>
          <section class="page">
            <div class="page-inner">5</div>
          </section>
        </div>
      </div>

      <footer class="footer">
        <button class="exit-btn" id="exitBtn" type="button">EXIT</button>
        <div class="footer-brand">STABLEFLOW</div>
        <button class="disconnect" id="disconnectBtn" type="button">DISCONNECT</button>
      </footer>

      <section class="cover" id="cover">
        <div class="cover-band top"></div>
        <div class="cover-band bottom"></div>

        <div class="cover-side-signal left"></div>
        <div class="cover-side-signal right"></div>
        <div class="cover-grain"></div>
        <div class="cover-bottom-glow"></div>

        <div class="cover-center">
          <button class="enter-zone" id="enterZone" type="button" aria-label="Tap the StableFlow logo to enter">
            <div class="logo-orb">
              <div class="bird">
                <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
                  <path d="M22 64C38 65 53 70 68 84" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M20 52C39 54 56 62 73 79" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M25 40C43 47 57 55 76 74" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M34 30C52 42 65 52 80 70" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M43 84C55 74 62 61 67 45" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M58 90C66 76 72 62 80 46" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M70 88C75 75 82 59 96 43" stroke="#f0b95e" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M80 72C74 63 73 52 78 44C82 38 90 38 94 43C98 48 96 54 90 56C86 57 82 55 81 51" stroke="#ffe18b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M92 44C100 40 105 37 111 32" stroke="#ffe18b" stroke-width="4.2" stroke-linecap="round"/>
                  <path d="M83 72C92 63 100 53 109 41" stroke="#ffe18b" stroke-width="4.2" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

            <div class="brand">
              <span class="stable">Stable</span><span class="flow">Flow</span>
            </div>

            <div class="tap-label">Tap to enter</div>
            <div class="tap-hint"></div>
          </button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const shell = document.getElementById("shell");
    const cover = document.getElementById("cover");
    const enterZone = document.getElementById("enterZone");
    const exitBtn = document.getElementById("exitBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const pages = document.getElementById("pages");
    const pagesWrap = document.getElementById("pagesWrap");
    const txStrip = document.getElementById("txStrip");
    const assistantText = document.getElementById("assistantText");

    let currentPage = 0;
    let startX = 0;
    let startY = 0;
    let moving = false;
    let walletConnected = false;
    let txTimer = null;

    const assistantLines = [
      "Swipe sideways to move through the pages.",
      "Use StableFlow to test payments on Arc.",
      "The assistant stays here while pages move below.",
      "Connect wallet when you are ready to use real actions.",
      "Keep each test payment small and safe."
    ];

    function setAssistantText(text){
      assistantText.textContent = text;
    }

    function setPage(index){
      currentPage = Math.max(0, Math.min(4, Number(index) || 0));
      pages.style.transform = `translateX(-${currentPage * 20}%)`;
      setAssistantText(assistantLines[currentPage] || assistantLines[0]);
    }

    function openShell(){
      if(cover.classList.contains("opening") || cover.classList.contains("hidden")) return;

      enterZone.classList.add("pressed");

      setTimeout(() => {
        cover.classList.add("opening");
        shell.classList.add("open");
      }, 120);

      setTimeout(() => {
        cover.classList.add("hidden");
        enterZone.classList.remove("pressed");
      }, 980);
    }

    function closeShell(){
      cover.classList.remove("hidden");
      cover.classList.remove("opening");
      shell.classList.remove("open");
      setPage(0);
    }

    function setWalletConnected(value){
      walletConnected = !!value;
      disconnectBtn.classList.toggle("active", walletConnected);
    }

    function flashTxDone(){
      clearTimeout(txTimer);
      txStrip.classList.add("show");

      txTimer = setTimeout(() => {
        txStrip.classList.remove("show");
      }, 4000);
    }

    function clearTxNotice(){
      clearTimeout(txTimer);
      txStrip.classList.remove("show");
    }

    enterZone.addEventListener("pointerdown", () => {
      enterZone.classList.add("pressed");
    });

    enterZone.addEventListener("pointerup", () => {
      openShell();
    });

    enterZone.addEventListener("pointercancel", () => {
      enterZone.classList.remove("pressed");
    });

    enterZone.addEventListener("pointerleave", () => {
      enterZone.classList.remove("pressed");
    });

    exitBtn.addEventListener("click", () => {
      closeShell();
    });

    disconnectBtn.addEventListener("click", () => {
      setWalletConnected(!walletConnected);
    });

    pagesWrap.addEventListener("touchstart", (event) => {
      if(!event.touches || !event.touches[0]) return;
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
      moving = true;
    }, {passive:true});

    pagesWrap.addEventListener("touchend", (event) => {
      if(!moving || !event.changedTouches || !event.changedTouches[0]) return;

      const endX = event.changedTouches[0].clientX;
      const endY = event.changedTouches[0].clientY;
      const dx = endX - startX;
      const dy = endY - startY;

      moving = false;

      if(Math.abs(dx) < 42) return;
      if(Math.abs(dx) < Math.abs(dy) * 1.15) return;

      if(dx < 0){
        setPage(currentPage + 1);
      }else{
        setPage(currentPage - 1);
      }
    }, {passive:true});

    window.StableFlowShell = {
      setWalletConnected,
      openShell,
      closeShell,
      setPage,
      flashTxDone,
      clearTxNotice
    };

    setPage(0);
  </script>
</body>
</html>
